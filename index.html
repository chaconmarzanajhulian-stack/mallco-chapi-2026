<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b"><link rel="icon" href="favicon.png"><title>Campeonato de Básquetbol Intercalles Mallco Chapi 2026</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--card2:#1b1b1e;--tx:#f6efdc;--mu:#a99d80;--gold:#e0b030;--gold2:#f6d26b;--gd:#8a6a14;--bd:#2f2610;--ok:#6fe39a;--okb:#0f3321;--no:#ff8a80;--nob:#3d1512;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,#2a2008 0%,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:960px;margin:0 auto;padding:16px 16px 40px}
.hero{text-align:center;padding:18px 0 6px}.logo{width:min(250px,62vw);height:auto;border-radius:22px;box-shadow:0 0 40px #e0b03040,0 0 0 1px var(--gd)}
h1{font-size:clamp(1.3rem,5vw,2rem);margin:16px 0 2px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--gd),var(--gold2),var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(1rem,3.6vw,1.3rem);color:var(--gold2);letter-spacing:3px;text-transform:uppercase}
.line{height:2px;width:120px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h2{font-size:1.05rem;margin:0;color:var(--gold2);text-transform:uppercase;letter-spacing:1.5px;line-height:1.3}
h3{margin:10px 0 8px;font-size:1rem;color:var(--gold2)}
.cats{display:grid;gap:12px;margin:14px 0}@media(min-width:700px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border:1px solid var(--gd);border-radius:16px;background:linear-gradient(145deg,#1d1808,var(--card));color:var(--tx);cursor:pointer;text-align:left;font-size:.95rem;transition:.2s}
.cat:hover{border-color:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 24px #e0b03022}
.cat b{display:block;font-size:1.3rem;color:var(--gold2);text-transform:uppercase;letter-spacing:1px}
.ic{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--gold2),var(--gd));color:#111;font-size:1.4rem;font-weight:800;flex:none}.ar{margin-left:auto;font-size:1.8rem;color:var(--gold)}
.top{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px}.top img{width:54px;height:54px;border-radius:12px}.top>div{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin:6px 0 4px;border-bottom:1px solid var(--bd)}
.tabs button{white-space:nowrap;padding:9px 14px;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:999px;cursor:pointer}
.tabs button.on{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111;border-color:var(--gold);font-weight:700}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{background:#0e0e10;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{width:100%;min-height:90px;margin:4px 0}
.btn{padding:8px 14px;border:0;border-radius:8px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111;font-weight:700;cursor:pointer}
.btn.g{background:var(--card2);color:var(--gold2);border:1px solid var(--gd)}.btn.r{background:var(--nob);color:var(--no);border:1px solid #6b2420}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--gold);font-weight:700;text-transform:uppercase;font-size:.75rem;letter-spacing:.5px;background:#17130a}
tr.top1 td{background:#2a210a}tr.top1 td:nth-child(2){color:var(--gold2);font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--no)}
.pre{white-space:pre-wrap;margin:4px 0}.mu{color:var(--mu);font-size:.85rem}
.b{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.ok{background:var(--okb);color:var(--ok)}.no{background:var(--nob);color:var(--no)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 6px;border-bottom:1px solid var(--bd);cursor:pointer}.li:hover{background:var(--card2)}
.m{padding:10px 12px;margin:8px 0;border:1px solid var(--bd);border-radius:12px;background:var(--card2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}.stat{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.15rem;color:var(--gold2)}.stat span{font-size:.75rem;color:var(--mu)}
.sc{width:62px}.sm{width:110px}
a.back{display:inline-block;cursor:pointer;color:var(--gold);padding:6px 0}
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;background:var(--card2);border:1px solid var(--gd);flex:none;overflow:hidden}
.sbd{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.sbd .n{font-size:2.6rem;font-weight:800;color:var(--gold2)}.clk{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
footer{margin-top:30px;text-align:center;color:var(--mu);font-size:.8rem}
</style>
</head></head><body><div id="app"></div><input id="fi" type="file" accept="image/*" hidden onchange="up(this)">
<script>
const CATS={m:'Masculino',f:'Femenino',n:'Niños'};
const mk=(i,c)=>({obj:'',extra:'',ins:i,c1:c,teams:[],matches:[],pay:{},fines:{}});
let S={ph:null,vis:{inicio:1,equipos:1,calendario:1,tabla:1,enf:1},c:{m:mk(400,200),f:mk(350,100),n:mk(300,150)}};
let org=false,cat=null,tab='inicio',selT=null,enfT=null,db=null,msg='',askpw=false;
const A=document.getElementById('app');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const C=()=>S.c[cat];
const T=id=>C().teams.find(t=>t.id==id);
const tn=id=>T(id)?E(T(id).name):'?';
const fd=d=>d?d.split('-').reverse().join('/'):'sin fecha';
const today=()=>new Date().toISOString().slice(0,10);
const sum=a=>(a||[]).reduce((s,x)=>s+(+x.amt||0),0);
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const val=id=>document.getElementById(id).value;

let PW='',saving=0;
async function api(p,o){const r=await fetch('/api/'+p,o);if(!r.ok)throw new Error(r.status);return r.json()}
function merge(o){S=Object.assign(S,o);for(const k in CATS)S.c[k]=Object.assign(mk(0,0),S.c[k])}
function save(){
  try{localStorage.setItem('mcp26',JSON.stringify(S))}catch(e){}
  render();
  if(!org)return;
  saving++;
  api('state',{method:'PUT',headers:{'x-pw':PW,'content-type':'application/json'},body:JSON.stringify(S)})
   .then(()=>{if(msg){msg='';render()}}).catch(()=>{msg='⚠ No se guardó en el servidor. Revisa tu conexión o vuelve a entrar.';render()}).finally(()=>saving--);
}
async function load(force){
  if((org&&!force)||saving)return;
  try{const d=await api('state');if(d&&d.c){merge(d);render()}}catch(e){}
}
async function init(){
  try{const l=localStorage.getItem('mcp26');if(l)merge(JSON.parse(l))}catch(e){}
  render();await load();setInterval(load,30000);
}

/* ---------- vistas ---------- */
function render(){A.innerHTML=cat?catView():home()}
function home(){
  return `<div class=hero><img class=logo src="logo.jpg" alt="Logo del club organizador"><h1>Campeonato de Básquetbol</h1><div class=sub>Intercalles Mallco Chapi 2026</div><div class=line></div></div>
  <p class=mu style="text-align:center">Selecciona una categoría</p>
  <div class=cats>${Object.keys(CATS).map(k=>`<button class=cat onclick="goCat('${k}')"><span class=ic>${{m:'♂',f:'♀',n:'★'}[k]}</span><span>Categoría<b>${CATS[k]}</b></span><span class=ar>›</span></button>`).join('')}</div>
  <div class=card>${org?`<b>Modo organizador activo</b> <button class="btn g" onclick="org=false;PW='';render()">Salir</button>`:
  askpw?`<div class=row><input id=pw type=password placeholder="Contraseña"><button class=btn onclick="login()">Entrar</button><button class="btn g" onclick="askpw=false;msg='';render()">Cancelar</button></div>`:
  `<button class="btn g" onclick="askpw=true;render()">🔒 Modo organizador</button>`}
  ${msg?`<p class=mu>${msg}</p>`:''}</div><footer>Campeonato Intercalles Mallco Chapi 2026</footer>`;
}
async function login(){
  const pw=val('pw');
  try{await api('login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pw})});PW=pw;org=true;askpw=false;msg='';await load(true)}
  catch(e){msg='Contraseña incorrecta o sin conexión.'}
  render();
}
function goCat(k){cat=k;selM=null;tab='inicio';selT=null;enfT=null;msg='';render()}
function tabsList(){
  const t=[['inicio','Inicio'],['equipos','Equipos'],['calendario','Calendario'],['tabla','Posiciones'],['enf','Enfrentamientos']].filter(x=>org||S.vis[x[0]]);
  if(org)t.push(['fin','Finanzas'],['cfg','Ajustes']);return t;
}
function catView(){
  const t=tabsList();if(!t.find(x=>x[0]==tab))tab=t[0]?.[0];
  const body={inicio,equipos,calendario,tabla,enf,fin,cfg}[tab];
  return `<a class=back onclick="cat=null;render()">← Inicio</a>
  <div class=top><img src="logo.jpg" alt=""><div><h2>Campeonato de Básquetbol</h2><div class=mu>Categoría ${CATS[cat]} · Mallco Chapi 2026</div></div></div>
  <div class=tabs>${t.map(x=>`<button class="${x[0]==tab?'on':''}" onclick="tab='${x[0]}';selT=null;selM=null;render()">${x[1]}</button>`).join('')}</div>
  ${msg?`<p class=mu>${msg}</p>`:''}${body?body():'<p class=mu>El organizador no habilitó secciones.</p>'}`;
}

/* inicio */
function inicio(){
  const c=C();
  return `<div class=card><h3>Objetivos del campeonato</h3><p class=pre>${E(c.obj)||'Aún sin información.'}</p>
  ${c.extra?`<h3>Más información</h3><p class=pre>${E(c.extra)}</p>`:''}</div>
  ${org?`<div class=card><h3>Editar objetivos</h3><textarea onchange="C().obj=this.value;save()">${E(c.obj)}</textarea>
  <h3>Editar más información</h3><textarea onchange="C().extra=this.value;save()">${E(c.extra)}</textarea></div>`:''}`;
}

/* equipos */
function equipos(){
  const c=C();
  if(selT&&T(selT))return equipo(T(selT));
  return `<div class=card>${c.teams.map(t=>`<div class=li onclick="selT='${t.id}';render()"><div class=row style="margin:0">${av(t.logo,40,'🛡')}<div><b>${E(t.name)}</b><div class=mu>Delegado: ${E(t.del)||'—'}</div></div></div><span class=mu>${t.players.length} jug. ›</span></div>`).join('')||'<p class=mu>Sin equipos registrados.</p>'}</div>
  ${org?`<div class=card><h3>Agregar equipo</h3><div class=row><input id=tnm placeholder="Nombre del equipo"><input id=tdl placeholder="Delegado"><button class=btn onclick="addTeam()">Agregar</button></div></div>`:''}`;
}
function addTeam(){const n=val('tnm').trim();if(!n)return;C().teams.push({id:uid(),name:n,del:val('tdl'),obs:'',players:[]});save()}
function equipo(t){
  return `<a class=back onclick="selT=null;render()">← Equipos</a>
  <div class=card><div class=row>${av(t.logo,72,'🛡')}<div><h3 style="margin:0">${E(t.name)}</h3><p class=mu style="margin:0">Delegado de equipo: ${E(t.del)||'—'}</p></div></div>${org?`<button class="btn g" onclick="pick('t','${t.id}')">📷 ${t.logo?'Cambiar':'Subir'} escudo</button>`:''}
  ${t.obs?`<p class=pre><b>Observación:</b> ${E(t.obs)}</p>`:''}
  <p class=mu>Habilitado = el jugador ya pisó la cancha en un partido (se marca solo). En la vuelta solo juegan los habilitados.</p>
  ${t.players.map(p=>`<div class=li style="cursor:default"><span class=row style="margin:0">${av(p.foto,44,'👤')}${E(p.n)}${org?`<button class="btn g" onclick="pick('p','${t.id}','${p.id}')">📷</button>`:''}</span><span>${org?`<button class="btn g" onclick="togP('${t.id}','${p.id}')">${p.hab?'Quitar hab.':'Habilitar'}</button> <button class="btn r" onclick="delP('${t.id}','${p.id}')">✕</button> `:''}<span class="b ${p.hab?'ok':'no'}">${p.hab?'Habilitado':'No habilitado'}</span></span></div>`).join('')||'<p class=mu>Sin jugadores.</p>'}</div>
  ${org?`<div class=card><h3>Agregar jugador</h3><div class=row><input id=pn placeholder="Nombre del jugador"><label><input id=ph type=checkbox> Habilitado</label><button class=btn onclick="addP('${t.id}')">Agregar</button></div></div>
  <div class=card><h3>Editar equipo</h3><div class=row><input value="${E(t.name)}" onchange="T('${t.id}').name=this.value;save()"><input value="${E(t.del)}" placeholder="Delegado" onchange="T('${t.id}').del=this.value;save()"></div>
  <textarea placeholder="Observación" onchange="T('${t.id}').obs=this.value;save()">${E(t.obs)}</textarea>
  <button class="btn r" onclick="if(confirm('¿Eliminar equipo y sus partidos?')){delTeam('${t.id}')}">Eliminar equipo</button></div>`:''}`;
}
const av=(id,z,ph)=>id?`<img class=av style="width:${z}px;height:${z}px" src="/api/photo/${id}" alt="" loading=lazy>`:`<span class=av style="width:${z}px;height:${z}px;font-size:${z*.5}px">${ph}</span>`;
let tgt=null;
function pick(k,t,p){tgt={k,t,p};document.getElementById('fi').click()}
function shrink(f,m){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.78)};i.onerror=no;i.src=URL.createObjectURL(f)})}
async function up(inp){
  const f=inp.files[0];inp.value='';if(!f||!tgt)return;
  try{
    const b=await shrink(f,tgt.k=='t'?400:480),id=uid()+Date.now().toString(36);
    const r=await fetch('/api/photo/'+id,{method:'PUT',headers:{'x-pw':PW,'content-type':'image/jpeg'},body:b});if(!r.ok)throw 0;
    const t=T(tgt.t),o=tgt.k=='t'?t:t.players.find(x=>x.id==tgt.p),old=tgt.k=='t'?o.logo:o.foto;
    if(tgt.k=='t')o.logo=id;else o.foto=id;
    if(old)fetch('/api/photo/'+old,{method:'DELETE',headers:{'x-pw':PW}}).catch(()=>{});
    msg='';save();
  }catch(e){msg='⚠ No se pudo subir la foto. Revisa tu conexión.';render()}
}
function addP(id){const n=val('pn').trim();if(!n)return;T(id).players.push({id:uid(),n,hab:document.getElementById('ph').checked});save()}
function togP(t,p){const x=T(t).players.find(y=>y.id==p);x.hab=!x.hab;save()}
function delP(t,p){T(t).players=T(t).players.filter(y=>y.id!=p);save()}
function delTeam(id){const c=C();c.teams=c.teams.filter(t=>t.id!=id);c.matches=c.matches.filter(m=>m.a!=id&&m.b!=id);selT=null;save()}

/* calendario */
const done=m=>m.wo||(m.sa!=null&&m.sb!=null);
function mRow(m){
  const lk=m.game&&m.game.locked,cb=lk?`<button class="btn g" onclick="selM='${m.id}';render()">Ver convocatoria</button>`:'';
  const res=m.wo?`<span class="b no">W.O. ${tn(m.wo)}</span>`:done(m)?`<b>${m.sa} - ${m.sb}</b>`:'<span class=mu>vs</span>';
  if(!org)return `<div class=m><span class=mu>${fd(m.date)}</span><br>${tn(m.a)} ${res} ${tn(m.b)}<div class=row>${cb}</div></div>`;
  const o=t=>`<option value="${t.id}">${E(t.name)}</option>`;
  return `<div class=m><div class=row><input type=date value="${m.date||''}" onchange="mu('${m.id}','date',this.value)"><b>${tn(m.a)}</b>
  <input class=sc type=number min=0 value="${m.sa??''}" onchange="mu('${m.id}','sa',this.value===''?null:+this.value)"> - <input class=sc type=number min=0 value="${m.sb??''}" onchange="mu('${m.id}','sb',this.value===''?null:+this.value)"><b>${tn(m.b)}</b></div>
  <div class=row><button class="btn ${lk?'g':''}" onclick="selM='${m.id}';render()">${lk?'✔ Convocatoria':'Convocatoria'}</button><select onchange="mu('${m.id}','wo',this.value||null)"><option value="">Sin W.O.</option><option value="${m.a}" ${m.wo==m.a?'selected':''}>W.O. ${tn(m.a)}</option><option value="${m.b}" ${m.wo==m.b?'selected':''}>W.O. ${tn(m.b)}</option></select>
  <button class="btn r" onclick="C().matches=C().matches.filter(x=>x.id!='${m.id}');save()">Eliminar</button></div></div>`;
}
/* ===== MESA DE CONTROL ===== */
let mesaId=null,pend=null,tm=null,t0=0;
const LG=m=>{const g=GM(m);if(g.ev===undefined)Object.assign(g,{q:1,clk:600,sc:24,run:false,arrow:'',ev:[],done:false});return g};
const fm=x=>{x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const QL=q=>q<=4?'Q'+q:'TE'+(q-4),hk=q=>q<=2?'h1':q<=4?'h2':'o'+q,toLim=q=>q<=2?2:q<=4?3:1;
const pn=(m,s,i)=>{const p=T(m[s]).players.find(x=>x.id==i),n=GM(m).t[s].p[i];return p?`#${n?n.n:''} ${E(p.n)}`:'—'};
function der(m){
  const g=LG(m),R={};
  for(const s of['a','b']){const pl={};Object.keys(g.t[s].p).forEach(i=>{const st=g.t[s].p[i].st;pl[i]={pts:0,f:0,t:0,u:0,d:0,on:st,ent:st}});R[s]={pts:0,q:{},tf:{},to:{},c:{C:0,B:0},pl}}
  g.ev.forEach(e=>{const r=R[e.s];
    if(e.t=='pts'){r.pts+=e.v;r.q[e.q]=(r.q[e.q]||0)+e.v;r.pl[e.p].pts+=e.v}
    else if(e.t=='foul'){if(e.k=='C'||e.k=='B')r.c[e.k]++;else{const p=r.pl[e.p];if(e.k=='P')p.f++;else if(e.k=='T')p.t++;else if(e.k=='U')p.u++;else p.d++;r.tf[e.q]=(r.tf[e.q]||0)+1}}
    else if(e.t=='to'){const h=hk(e.q);r.to[h]=(r.to[h]||0)+1}
    else if(e.t=='sub'){r.pl[e.o].on=0;r.pl[e.i].on=1;r.pl[e.i].ent=1}});
  for(const s of['a','b']){const r=R[s];Object.values(r.pl).forEach(p=>{p.out=p.d>0||p.f+p.t+p.u>=5||p.t+p.u>=2});r.cdq=r.c.C>=2||r.c.C+r.c.B>=3}
  return R}
function ev(id,e){const g=LG(G(id));msg='';pend=null;g.ev.push(Object.assign({q:g.q,c:Math.ceil(g.clk)},e));save()}
const pts=(id,s,p,v)=>ev(id,{t:'pts',s,p,v}),foul=(id,s,p,k)=>ev(id,{t:'foul',s,p,k}),sub=(id,s,o,i)=>ev(id,{t:'sub',s,o,i});
function tout(id,s){const m=G(id),g=LG(m),r=der(m)[s];
  if((r.to[hk(g.q)]||0)>=toLim(g.q)){msg='⚠ Sin tiempos muertos disponibles en este período.';return render()}
  if(g.q==4&&g.clk<=120&&g.ev.filter(e=>e.t=='to'&&e.s==s&&e.q==4&&e.c<=120).length>=2){msg='⚠ Máximo 2 tiempos muertos en los últimos 2 minutos.';return render()}
  stopC(g,1);ev(id,{t:'to',s})}
function undo(id){if(confirm('¿Deshacer la última jugada?')){LG(G(id)).ev.pop();save()}}
function stopC(g,q){g.run=false;clearInterval(tm);if(!q)save()}
function clk(id){const g=LG(G(id));if(g.done)return;if(g.run)return stopC(g);if(g.clk<=0)return;g.run=true;t0=Date.now();clearInterval(tm);tm=setInterval(()=>tick(g),200);render()}
function tick(g){const n=Date.now(),d=(n-t0)/1000;t0=n;g.clk=Math.max(0,g.clk-d);g.sc=Math.max(0,g.sc-d);
  const a=document.getElementById('ck'),b=document.getElementById('sk');if(a)a.textContent=fm(g.clk);if(b)b.textContent=Math.ceil(g.sc);
  if(g.clk<=0||g.sc<=0){stopC(g,1);try{navigator.vibrate(600)}catch(e){}msg=g.clk<=0?'⏱ Fin del período.':'⏱ Violación de 24 segundos.';save()}}
function rs(id,v){const g=LG(G(id));g.sc=v==14&&g.sc>=14?g.sc:v;render()}
function adj(id){const g=LG(G(id)),v=prompt('Tiempo restante (min:seg)',fm(g.clk));if(!v)return;const[a,b]=v.split(':'),x=(+a)*60+(+b||0);if(isNaN(x)||x<0||x>600)return;g.clk=x;save()}
function arrow(id,v){LG(G(id)).arrow=v;save()}
function nq(id){const m=G(id),g=LG(m),R=der(m);stopC(g,1);
  if(g.q>=4&&R.a.pts!=R.b.pts){msg='El partido ya se puede finalizar (no hay empate).';return render()}
  if(g.clk>0&&!confirm('Quedan '+fm(g.clk)+' en el reloj. ¿Terminar el período?'))return;
  g.q++;g.clk=g.q<=4?600:300;g.sc=24;save()}
function fin_(id){const m=G(id),g=LG(m),R=der(m);
  if(R.a.pts==R.b.pts){msg='⚠ Hay empate: se juega tiempo extra.';return render()}
  if(!confirm('¿Finalizar el partido '+R.a.pts+' - '+R.b.pts+'?'))return;
  stopC(g,1);m.sa=R.a.pts;m.sb=R.b.pts;m.wo=null;g.done=true;
  for(const s of['a','b'])Object.keys(R[s].pl).forEach(i=>{if(R[s].pl[i].ent){const p=T(m[s]).players.find(x=>x.id==i);if(p&&!p.hab){p.hab=true;p.hm=m.id}}});save()}
function reab(id){if(!confirm('¿Reabrir el partido? El resultado se borra de la tabla hasta finalizar de nuevo.'))return;const m=G(id);LG(m).done=false;m.sa=null;m.sb=null;save()}
function evTxt(m,e){const t=tn(m[e.s]),w=e.t=='pts'?`+${e.v} ${pn(m,e.s,e.p)}`:e.t=='foul'?`Falta ${e.k} ${e.p?pn(m,e.s,e.p):'(entrenador)'}`:e.t=='to'?'Tiempo muerto':`Cambio: sale ${pn(m,e.s,e.o)}, entra ${pn(m,e.s,e.i)}`;return `${QL(e.q)} ${fm(e.c)} · ${t} · ${w}`}
function mt(m,s,R,g){
  const r=R[s],t=g.t[s],tm_=T(m[s]),fq=r.tf[g.q]||0,toL=toLim(g.q)-(r.to[hk(g.q)]||0),L=g.done,id=m.id;
  const ids=Object.keys(t.p),on=ids.filter(i=>r.pl[i].on),bn=ids.filter(i=>!r.pl[i].on);
  const row=i=>{const p=r.pl[i],pe=pend&&pend.s==s&&pend.p==i,bench=bn.filter(b=>!r.pl[b].out);
    return `<div class=m><div class=row><b>#${t.p[i].n}</b> ${E(tm_.players.find(x=>x.id==i)?.n)} <span class="b ${p.out?'no':'ok'}">${p.pts} pts · F${p.f+p.t+p.u+p.d}${p.out?' · FUERA, debe salir':''}</span></div>
    ${L?'':`<div class=row>${[1,2,3].map(v=>`<button class=btn onclick="pts('${id}','${s}','${i}',${v})">+${v}</button>`).join('')}<button class="btn g" onclick="pend={s:'${s}',p:'${i}',k:'f'};render()">Falta</button><button class="btn g" onclick="pend={s:'${s}',p:'${i}',k:'s'};render()">⇄ Cambio</button></div>`}
    ${pe&&pend.k=='f'?`<div class=row>${['P','T','U','D'].map(k=>`<button class="btn r" onclick="foul('${id}','${s}','${i}','${k}')">${k}</button>`).join('')}<button class="btn g" onclick="pend=null;render()">✕</button><span class=mu>P personal · T técnica · U antideportiva · D descalificante</span></div>`:''}
    ${pe&&pend.k=='s'?`<div class=row>Entra: ${bench.map(b=>`<button class=btn onclick="sub('${id}','${s}','${i}','${b}')">#${t.p[b].n} ${E(tm_.players.find(x=>x.id==b)?.n)}</button>`).join('')||'<span class=mu>Sin banca</span>'}<button class="btn g" onclick="pend=null;render()">✕</button></div>`:''}</div>`};
  return `<div class=card><h3>${E(tm_.name)} <span class="b ${fq>=4?'no':'ok'}">Faltas ${fq}${fq>=4?' · PENAL':''}</span></h3>
  <div class=row><span class=mu>T. muertos: ${Math.max(0,toL)}</span>${L?'':`<button class="btn g" onclick="tout('${id}','${s}')">Tiempo muerto</button>`}<span class=mu>Entrenador C${r.c.C} B${r.c.B}${r.cdq?' · DESCALIFICADO':''}</span>${L?'':`<button class="btn g" onclick="foul('${id}','${s}','','C')">Técnica C</button><button class="btn g" onclick="foul('${id}','${s}','','B')">Técnica B</button>`}</div>
  <h3>En cancha</h3>${on.map(row).join('')||'<p class=mu>Nadie en cancha.</p>'}
  <h3>Banca</h3><div class=row>${bn.map(i=>`<span class="b ${r.pl[i].out?'no':'ok'}">#${t.p[i].n} ${E(tm_.players.find(x=>x.id==i)?.n)}${r.pl[i].out?' (fuera)':''}</span>`).join('')||'<span class=mu>—</span>'}</div>
  ${L||m.leg=='vuelta'?'':`<div class=row><input id="nn-${s}" placeholder="Jugador nuevo"><input id="nu-${s}" type=number min=0 max=99 class=sc placeholder="N.º"><button class="btn g" onclick="newP('${id}','${s}')">+ Agregar</button></div>`}</div>`}
function mesa(m){
  const g=LG(m),R=der(m),L=g.done,id=m.id,qs=[];for(let q=1;q<=g.q;q++)qs.push(`${QL(q)} ${R.a.q[q]||0}-${R.b.q[q]||0}`);
  return `<a class=back onclick="mesaId=null;selM=null;render()">← Calendario</a>
  <div class=card><div class=sbd><div><div class=mu>${tn(m.a)}</div><div class=n>${R.a.pts}</div></div><div><div class=mu>${QL(g.q)}${L?' · FINAL':''}</div><div id=ck class=clk>${fm(g.clk)}</div><div class=mu>24 s: <b id=sk>${Math.ceil(g.sc)}</b></div></div><div><div class=mu>${tn(m.b)}</div><div class=n>${R.b.pts}</div></div></div>
  <p class=mu style="text-align:center">${qs.join(' · ')}</p>
  ${L?`<div class=row><span class="b ok">Partido finalizado y enviado a la tabla</span><button class="btn g" onclick="reab('${id}')">Reabrir</button></div>`:`<div class=row><button class=btn onclick="clk('${id}')">${g.run?'⏸ Parar reloj':'▶ Iniciar reloj'}</button><button class="btn g" onclick="rs('${id}',24)">24</button><button class="btn g" onclick="rs('${id}',14)">14</button><button class="btn g" onclick="adj('${id}')">Ajustar reloj</button></div>
  <div class=row><span class=mu>Posesión (flecha):</span><button class="btn ${g.arrow=='a'?'':'g'}" onclick="arrow('${id}','a')">${tn(m.a)}</button><button class="btn ${g.arrow=='b'?'':'g'}" onclick="arrow('${id}','b')">${tn(m.b)}</button></div>
  <div class=row><button class="btn g" onclick="nq('${id}')">Terminar período</button><button class="btn g" onclick="fin_('${id}')">Finalizar partido</button><button class="btn r" onclick="undo('${id}')">↶ Deshacer</button></div>`}</div>
  ${mt(m,'a',R,g)}${mt(m,'b',R,g)}
  <div class=card><h3>Últimas jugadas</h3>${g.ev.slice(-8).reverse().map(e=>`<div class=m>${evTxt(m,e)}</div>`).join('')||'<p class=mu>Aún sin jugadas.</p>'}</div>`}
let selM=null;
const G=id=>C().matches.find(m=>m.id==id);
const GM=m=>m.game||(m.game={place:'',time:'',of:{r1:'',r2:'',r3:'',co:'',an:'',aa:'',cr:'',o24:''},t:{a:{p:{},cap:'',dt:'',at:''},b:{p:{},cap:'',dt:'',at:''}},locked:false});
const OF={r1:'Árbitro principal',r2:'Árbitro 1',r3:'Árbitro 2',co:'Comisario',an:'Anotador',aa:'Asistente de anotador',cr:'Cronometrista',o24:'Operador de 24 s'};
function cv(id,s,p){msg='';const t=GM(G(id)).t[s];if(t.p[p]){delete t.p[p];if(t.cap==p)t.cap=''}else{if(Object.keys(t.p).length>=12){msg='⚠ Máximo 12 jugadores por equipo.';return render()}t.p[p]={n:'',st:0}}save()}
function cf(id,s,p,k,v){msg='';const t=GM(G(id)).t[s];
  if(k=='cap')t.cap=p;
  else if(k=='st'){if(v&&Object.values(t.p).filter(x=>x.st).length>=5){msg='⚠ Solo puede haber 5 titulares.';return render()}t.p[p].st=v?1:0}
  else t.p[p].n=v===''?'':Math.max(0,Math.min(99,Math.round(+v)));
  save()}
function gf(id,k,v){const g=GM(G(id));if(k.includes('.')){const[a,b]=k.split('.');g[a][b]=v}else g[k]=v;save()}
function tf(id,s,k,v){GM(G(id)).t[s][k]=v;save()}
function chk(m){
  const g=GM(m),e=[];
  for(const s of['a','b']){
    const t=g.t[s],ids=Object.keys(t.p),nm=T(m[s]).name,nums=ids.map(i=>t.p[i].n);
    if(ids.length<5)e.push(nm+': mínimo 5 jugadores convocados');
    if(nums.some(n=>n===''))e.push(nm+': falta número de camiseta');
    if(new Set(nums).size<nums.length)e.push(nm+': números de camiseta repetidos');
    if(ids.filter(i=>t.p[i].st).length!=5)e.push(nm+': deben marcarse exactamente 5 titulares');
    if(!t.cap||!t.p[t.cap])e.push(nm+': falta elegir capitán');
  }
  return e}
function newP(id,s){
  const m=G(id),t=GM(m).t[s],tm=T(m[s]),nm=val('nn-'+s).trim(),nu=val('nu-'+s);
  if(!nm)return;
  if(m.leg=='vuelta'){msg='⚠ En la vuelta no se pueden agregar jugadores nuevos.';return render()}
  if(Object.keys(t.p).length>=12){msg='⚠ Máximo 12 jugadores por equipo.';return render()}
  if(tm.players.some(p=>p.n.trim().toLowerCase()==nm.toLowerCase())){msg='⚠ Ese jugador ya está en la lista del equipo.';return render()}
  const p={id:uid(),n:nm,hab:false};tm.players.push(p);
  t.p[p.id]={n:nu===''?'':Math.max(0,Math.min(99,Math.round(+nu))),st:0};msg='';save()}
function lock(id,v){
  if(!v&&G(id).game.ev&&G(id).game.ev.length){alert('El partido ya tiene jugadas registradas.');return}
  const m=G(id);
  if(v){const e=chk(m);if(e.length){alert('Falta completar:\n\n• '+e.join('\n• '));return}}
  if(v)for(const s of['a','b']){const t=GM(m).t[s];Object.keys(t.p).filter(i=>t.p[i].st).forEach(i=>{const p=T(m[s]).players.find(x=>x.id==i);if(p&&!p.hab){p.hab=true;p.hm=m.id}})}
  GM(m).locked=v;save()}
function teamPanel(m,s){
  const g=GM(m),t=g.t[s],tm=T(m[s]),ro=!org||g.locked,n=Object.keys(t.p).length,st=Object.values(t.p).filter(x=>x.st).length;
  const pl=ro?tm.players.filter(p=>t.p[p.id]).sort((a,b)=>t.p[a.id].n-t.p[b.id].n):tm.players;
  const rows=pl.map(p=>{const x=t.p[p.id];
    if(ro)return `<div class=li style="cursor:default"><span class=row style="margin:0">${av(p.foto,36,'👤')}<b>#${x.n}</b> ${E(p.n)} ${t.cap==p.id?'<span class="b ok">Capitán</span>':''}</span>${x.st?'<span class="b ok">Titular</span>':'<span class=mu>Banca</span>'}</div>`;
    return `<div class=m><div class=row><label><input type=checkbox ${x?'checked':''} ${m.leg=='vuelta'&&!p.hab&&!x?'disabled':''} onchange="cv('${m.id}','${s}','${p.id}')"> ${av(p.foto,32,'👤')} ${E(p.n)}</label>${p.hab?'':`<span class="b no">${m.leg=='vuelta'?'No habilitado: no puede jugar la vuelta':'Aún sin pisar cancha'}</span>`}</div>
    ${x?`<div class=row>N.º <input class=sc type=number min=0 max=99 value="${x.n}" onchange="cf('${m.id}','${s}','${p.id}','n',this.value)"><label><input type=checkbox ${x.st?'checked':''} onchange="cf('${m.id}','${s}','${p.id}','st',this.checked)"> Titular</label><label><input type=radio name="cap${s}" ${t.cap==p.id?'checked':''} onchange="cf('${m.id}','${s}','${p.id}','cap')"> Capitán</label></div>`:''}</div>`}).join('');
  return `<div class=card><h3>${E(tm.name)}</h3><p class=mu>Convocados ${n}/12 · Titulares ${st}/5</p>${rows||'<p class=mu>Sin jugadores.</p>'}
  ${ro?'':m.leg=='vuelta'?'<p class=mu>En la vuelta no se pueden agregar jugadores nuevos.</p>':`<h3>Jugador nuevo (llegó y no está en la lista)</h3><div class=row><input id="nn-${s}" placeholder="Nombre del jugador"><input id="nu-${s}" type=number min=0 max=99 class=sc placeholder="N.º"><button class=btn onclick="newP('${m.id}','${s}')">Agregar al equipo y al partido</button></div>`}
  ${ro?`<p><b>Entrenador:</b> ${E(t.dt)||'—'} · <b>Asistente:</b> ${E(t.at)||'—'}</p>`:`<div class=row><input placeholder="Entrenador" value="${E(t.dt)}" onchange="tf('${m.id}','${s}','dt',this.value)"><input placeholder="Asistente" value="${E(t.at)}" onchange="tf('${m.id}','${s}','at',this.value)"></div>`}</div>`}
function convoc(m){
  const g=GM(m),ro=!org||g.locked;
  const of=Object.keys(OF).map(k=>ro?`<div class=row><span class=mu>${OF[k]}:</span> ${E(g.of[k])||'—'}</div>`:`<div class=row><input placeholder="${OF[k]}" value="${E(g.of[k])}" onchange="gf('${m.id}','of.${k}',this.value)"></div>`).join('');
  return `<a class=back onclick="selM=null;render()">← Calendario</a>
  <div class=card><h3>${tn(m.a)} vs ${tn(m.b)}</h3><p class=mu>${m.leg=='ida'?'Ida':'Vuelta'} · ${fd(m.date)} ${g.locked?'<span class="b ok">Convocatoria cerrada</span>':'<span class="b no">En preparación</span>'}</p>
  ${ro?`<p><b>Lugar:</b> ${E(g.place)||'—'} · <b>Hora:</b> ${E(g.time)||'—'}</p>`:`<div class=row><input placeholder="Lugar / cancha" value="${E(g.place)}" onchange="gf('${m.id}','place',this.value)"><input type=time value="${E(g.time)}" onchange="gf('${m.id}','time',this.value)"></div>`}
  <h3>Árbitros y mesa de control</h3>${of}</div>
  ${teamPanel(m,'a')}${teamPanel(m,'b')}
  ${org?`<div class=card>${g.locked?`<button class=btn onclick="mesaId='${m.id}';render()">▶ Mesa de control</button> <button class="btn g" onclick="lock('${m.id}',false)">Reabrir convocatoria</button>`:`<button class=btn onclick="lock('${m.id}',true)">Cerrar convocatoria</button><p class=mu>Se revisa: mínimo 5 y máximo 12 jugadores, número de camiseta sin repetir, 5 titulares y un capitán.</p>`}</div>`:''}`}
function mu(id,k,v){C().matches.find(m=>m.id==id)[k]=v;save()}
function calendario(){
  if(selM&&G(selM))return selM==mesaId&&GM(G(selM)).locked?mesa(G(selM)):convoc(G(selM));
  const c=C(),o=c.teams.map(t=>`<option value="${t.id}">${E(t.name)}</option>`).join('');
  const sec=l=>{const ms=c.matches.filter(m=>m.leg==l).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
    return `<div class=card><h3>${l=='ida'?'Partidos de ida':'Partidos de vuelta'}</h3>${ms.map(mRow).join('')||'<p class=mu>Sin partidos.</p>'}</div>`};
  return sec('ida')+sec('vuelta')+(org?`<div class=card><h3>Agregar partido</h3><div class=row>
  <select id=ml><option value=ida>Ida</option><option value=vuelta>Vuelta</option></select><input id=md type=date>
  <select id=ma>${o}</select> vs <select id=mb>${o}</select><button class=btn onclick="addM()">Agregar</button></div>
  <div class=row><button class="btn g" onclick="gen()">Generar partidos restantes (ida y vuelta)</button></div></div>`:'');
}
function addM(){const a=val('ma'),b=val('mb');if(!a||!b||a==b)return;C().matches.push({id:uid(),leg:val('ml'),date:val('md'),a,b,sa:null,sb:null,wo:null});save()}
function gen(){
  const c=C(),ids=c.teams.map(t=>t.id);
  const has=(a,b,l)=>c.matches.some(m=>m.leg==l&&((m.a==a&&m.b==b)||(m.a==b&&m.b==a)));
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    if(!has(ids[i],ids[j],'ida'))c.matches.push({id:uid(),leg:'ida',date:'',a:ids[i],b:ids[j],sa:null,sb:null,wo:null});
    if(!has(ids[i],ids[j],'vuelta'))c.matches.push({id:uid(),leg:'vuelta',date:'',a:ids[j],b:ids[i],sa:null,sb:null,wo:null});
  }save();
}

/* posiciones */
function calc(leg){
  const R={};C().teams.forEach(t=>R[t.id]={n:t.name,pj:0,pg:0,pp:0,wo:0,pf:0,pc:0,pts:0});
  C().matches.forEach(m=>{
    if((leg&&m.leg!=leg)||!done(m)||!R[m.a]||!R[m.b])return;
    const A=R[m.a],B=R[m.b];let W,L;
    if(m.wo){L=m.wo==m.a?A:B;W=L==A?B:A;L.wo++}
    else{if(m.sa==m.sb)return;W=m.sa>m.sb?A:B;L=W==A?B:A;A.pf+=m.sa;A.pc+=m.sb;B.pf+=m.sb;B.pc+=m.sa;L.pts+=1}
    A.pj++;B.pj++;W.pg++;W.pts+=2;L.pp++;
  });
  return Object.values(R).sort((a,b)=>b.pts-a.pts||(b.pf-b.pc)-(a.pf-a.pc)||b.pf-a.pf);
}
function tbl(title,rows){
  return `<div class=card><h3>${title}</h3><div class=tw><table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>W.O.</th><th>PF</th><th>PC</th><th>Dif</th><th>Pts</th></tr>
  ${rows.map((r,i)=>`<tr class="${i==0&&r.pj?'top1':''}"><td>${i+1}</td><td>${E(r.n)}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td><td>${r.wo}</td><td>${r.pf}</td><td>${r.pc}</td><td class="${r.pf>r.pc?'pos':r.pf<r.pc?'neg':''}">${r.pf-r.pc}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div>
  ${rows.length?'':'<p class=mu>Sin equipos.</p>'}</div>`;
}
function tabla(){
  return tbl('Tabla oficial',calc(''))+tbl('Solo ida',calc('ida'))+tbl('Solo vuelta',calc('vuelta'))+
  '<p class=mu>Ganado = 2 pts · Perdido = 1 pt · W.O. = 0 pts (cuenta como perdido).</p>';
}

/* enfrentamientos */
function enf(){
  const c=C();if(!enfT||!T(enfT))enfT=c.teams[0]?.id;
  if(!enfT)return '<p class=mu>Sin equipos.</p>';
  const rows=c.teams.filter(t=>t.id!=enfT).map(r=>{
    let pf=0,pc=0,g=0,p=0;
    const ls=c.matches.filter(m=>done(m)&&((m.a==enfT&&m.b==r.id)||(m.b==enfT&&m.a==r.id))).map(m=>{
      const me=m.a==enfT;
      if(m.wo){const w=m.wo!=enfT;w?g++:p++;return `${m.leg}: W.O. ${w?'(ganó)':'(perdió)'}`}
      const x=me?m.sa:m.sb,y=me?m.sb:m.sa;pf+=x;pc+=y;x>y?g++:p++;return `${m.leg}: ${x}-${y}`});
    return `<tr><td>${E(r.name)}</td><td style="text-align:left">${ls.join(' · ')||'—'}</td><td>${g}-${p}</td><td>${pf}</td><td>${pc}</td><td>${pf-pc}</td></tr>`;
  }).join('');
  return `<div class=card><div class=row><b>Equipo:</b><select onchange="enfT=this.value;render()">${c.teams.map(t=>`<option value="${t.id}" ${t.id==enfT?'selected':''}>${E(t.name)}</option>`).join('')}</select></div>
  <div class=tw><table><tr><th>Rival</th><th>Resultados</th><th>G-P</th><th>PF total</th><th>PC total</th><th>Dif</th></tr>${rows}</table></div></div>`;
}

/* finanzas (solo organizador) */
function fin(){
  const c=C();let ei=0,ec=0,mt=0,mc=0;
  const cards=c.teams.map(t=>{
    const pay=c.pay[t.id]||[],fn=c.fines[t.id]||[],pd=sum(pay),debe=c.ins-pd;
    ei+=c.ins;ec+=pd;mt+=sum(fn);mc+=sum(fn.filter(f=>f.paid));
    const mp=fn.filter(f=>!f.paid).length;
    return `<div class=card><h3>${E(t.name)} <span class="b ${debe<=0?'ok':'no'}">${debe<=0?'Inscripción al día':'Debe Bs '+debe}</span> <span class="b ${mp?'no':'ok'}">${mp?'Multas pendientes':'Multas al día'}</span></h3>
    <p class=mu>Pagado Bs ${pd} de Bs ${c.ins}</p>
    ${pay.map((p,i)=>`<div class=row>Bs ${p.amt} · ${fd(p.date)} <button class="btn r" onclick="C().pay['${t.id}'].splice(${i},1);save()">✕</button></div>`).join('')}
    <div class=row><input id="pa-${t.id}" type=number class=sm placeholder="Monto Bs"><input id="pd-${t.id}" type=date value="${today()}"><button class=btn onclick="addPay('${t.id}',val('pa-${t.id}'),val('pd-${t.id}'))">Registrar pago</button>
    <button class="btn g" onclick="addPay('${t.id}',${c.c1},'${today()}')">1ª cuota (Bs ${c.c1})</button></div>
    <h3>Multas</h3>${fn.map((f,i)=>`<div class=row>${E(f.why)} · Bs ${f.amt} · ${f.paid?`<span class="b ok">Pagada ${fd(f.date)}</span>`:`<span class="b no">Pendiente</span> <button class="btn g" onclick="payFine('${t.id}',${i})">Marcar pagada</button>`} <button class="btn r" onclick="C().fines['${t.id}'].splice(${i},1);save()">✕</button></div>`).join('')||'<p class=mu>Sin multas.</p>'}
    <div class=row><input id="fw-${t.id}" placeholder="Motivo de la multa"><input id="fa-${t.id}" type=number class=sm placeholder="Bs"><button class=btn onclick="addFine('${t.id}')">Agregar multa</button></div></div>`;
  }).join('');
  return `<div class=card><h3>Montos de inscripción</h3><div class=row>Inscripción Bs <input type=number class=sm value="${c.ins}" onchange="C().ins=+this.value;save()"> 1ª cuota Bs <input type=number class=sm value="${c.c1}" onchange="C().c1=+this.value;save()"></div></div>
  <div class=card><h3>Resumen de inscripciones</h3><div class=stats><div class=stat><b>Bs ${ei}</b><span>Esperado</span></div><div class=stat><b>Bs ${ec}</b><span>Cobrado</span></div><div class=stat><b>Bs ${ei-ec}</b><span>Por cobrar</span></div></div>
  <h3>Resumen de multas</h3><div class=stats><div class=stat><b>Bs ${mt}</b><span>Total</span></div><div class=stat><b>Bs ${mc}</b><span>Cobrado</span></div><div class=stat><b>Bs ${mt-mc}</b><span>Pendiente</span></div></div></div>${cards||'<p class=mu>Agrega equipos primero.</p>'}`;
}
function addPay(t,a,d){if(!(+a>0))return;(C().pay[t]=C().pay[t]||[]).push({amt:+a,date:d});save()}
function addFine(t){const w=val('fw-'+t).trim(),a=+val('fa-'+t);if(!w||!(a>0))return;(C().fines[t]=C().fines[t]||[]).push({why:w,amt:a,paid:false,date:''});save()}
function payFine(t,i){const f=C().fines[t][i];f.paid=true;f.date=today();save()}

/* ajustes */
function cfg(){
  const n={inicio:'Inicio',equipos:'Equipos',calendario:'Calendario',tabla:'Posiciones',enf:'Enfrentamientos'};
  return `<div class=card><h3>Qué ven los invitados</h3>${Object.keys(n).map(k=>`<div class=row><label><input type=checkbox ${S.vis[k]?'checked':''} onchange="S.vis['${k}']=this.checked?1:0;save()"> ${n[k]}</label></div>`).join('')}
  <p class=mu>Finanzas y Ajustes nunca se muestran a invitados.</p></div>
  <div class=card><h3>Respaldo</h3><div class=row><button class=btn onclick="backup()">Descargar respaldo</button><input type=file accept=".json" onchange="restore(this)"></div>
  <p class=mu>Descarga una copia de todos los datos de las 3 categorías o restáurala desde un archivo.</p></div>
  <div class=card><h3>Contraseña</h3><p class=mu>Se cambia en Netlify: Site configuration → Environment variables → ORG_PASSWORD, y luego un nuevo deploy.</p></div>`;
}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='respaldo-mallco-chapi-'+today()+'.json';a.click()}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.c)throw 0;if(confirm('Esto reemplaza los datos actuales. ¿Continuar?')){merge(d);save()}}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
init();
</script></body></html>
